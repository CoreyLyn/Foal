version: 2

project_name: foal

builds:
  - id: foal
    main: ./cmd/foal
    binary: foal
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/CoreyLyn/Foal/internal/buildinfo.Version={{ .Tag }}
        -X github.com/CoreyLyn/Foal/internal/buildinfo.Commit={{ .FullCommit }}
    goos:
      - windows
    goarch:
      - amd64
      - arm64

  - id: fo
    main: ./cmd/fo
    binary: fo
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/CoreyLyn/Foal/internal/buildinfo.Version={{ .Tag }}
        -X github.com/CoreyLyn/Foal/internal/buildinfo.Commit={{ .FullCommit }}
    goos:
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: windows
    ids:
      - foal
      - fo
    formats:
      - zip
    name_template: "foal_{{ .Version }}_windows_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github-native

release:
  draft: true
  use_existing_draft: true
  replace_existing_artifacts: true
  prerelease: auto
